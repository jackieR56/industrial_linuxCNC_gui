# GUI settings — paste these sections into the LinuxCNC machine ini.
# Every key is optional; anything missing or malformed falls back to the
# value shown here (the built-in default). Colors are "R, G, B" (0-255).

[DISPLAY]
# Program directory for PRGRM/DIR (standard LinuxCNC key).
# Default when absent: ~/linuxcnc/nc_files
PROGRAM_PREFIX = ~/linuxcnc/nc_files

[GUI]
# Set this to your panel font. The default below ships with Debian/Ubuntu;
# the reference machine used an ISOCPEUR-style face.
FONT_PATH = /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
FONT_SIZE = 48
LARGE_FONT_SIZE = 180
# Auto-mounted panel USB ports, comma-separated; first one present is used
USB_MOUNTS = /media/usb0, /media/usb1
# "XYZAC" for the 5-axis, "XYZ" for the 3-axis
AXES = XYZAC
# 1 = status pane always shows position/modals instead of load bars
ALWAYS_SHOW_POSITION = 1
# 1 = keep executed MDI blocks listed on the MDI page
SHOW_MDI_HISTORY = 1
# SYSTEM PHYS / HAL IO viewer: point list (relative = config dir; written
# from the live HAL when missing), grid font size, sample period in ms
IO_MAP = io_map.yaml
IO_FONT_SIZE = 30
IO_SAMPLE_MS = 50

[GUI_COLORS]
# --- general ---
BACKGROUND = 0, 0, 0
TEXT = 255, 255, 255
# text drawn on a highlighted (HILITE) fill
TEXT_INVERSE = 0, 0, 0
ALARM = 250, 0, 0
DIM = 150, 150, 150
ACCENT = 255, 150, 40
OK = 40, 200, 120
# softkey frame and status pane border
FRAME = 0, 0, 255
# active softkey fill and reverse-video cursors
HILITE = 230, 230, 230
# E-stop box blink phases
EMG_ON = 200, 0, 0
EMG_DIM = 80, 0, 0

# --- softkey labels ---
KEY_PAGE = 0, 100, 255
KEY_ENTRY = 0, 255, 0
KEY_ACT = 255, 0, 0
KEY_MENU = 255, 255, 255

# --- status pane load bars ---
LOAD_RAIL = 130, 60, 60
LOAD_OK = 40, 200, 120
LOAD_OVER = 220, 60, 60

# --- POS screen home indicator ---
HOME_MARK = 255, 255, 255

# --- work probe page ---
CURSOR_CELL = 60, 60, 60
GRID_ON = 27, 95, 165
GRID_OFF = 45, 45, 45
PROBE_FEATURE = 60, 200, 90
PROBE_START = 250, 60, 60
PROBE_PATH = 180, 120, 230

# --- SYSTEM PHYS / HAL IO viewer ---
# lamp lit / unlit, outline on a cell that changed in the last second
IO_ON = 40, 200, 120
IO_OFF = 45, 45, 45
IO_EDGE = 255, 150, 40

# --- help overlay (HELP_DIM is R, G, B, ALPHA) ---
HELP_DIM = 0, 0, 0, 200
HELP_BORDER = 60, 120, 220
HELP_TITLE = 120, 190, 255

# --- graphics / backplot ---
# feed-move color per tool (tool number mod list length), ";"-separated
BP_TOOL_PALETTE = 255,255,255; 255,210,60; 80,220,100; 100,170,255; 255,120,120; 220,120,255; 90,230,230; 255,160,40
BP_RAPID = 70, 70, 130
BP_GRAY_FEED = 85, 85, 85
BP_GRAY_RAPID = 40, 40, 60
BP_MARKER = 255, 255, 0
BP_TOOL_VECTOR = 255, 160, 40
BP_AXIS_X = 255, 60, 60
BP_AXIS_Y = 60, 220, 60
BP_AXIS_Z = 80, 120, 255
